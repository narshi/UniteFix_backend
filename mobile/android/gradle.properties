# Gradle JVM — enough memory for a full Expo release build
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.daemon=true

# AndroidX — REQUIRED. Every modern Expo/RN dependency uses AndroidX.
# Without this Gradle aborts with "useAndroidX property is not enabled".
android.useAndroidX=true
# Jetifier auto-migrates old Support Library deps → AndroidX at build time.
android.enableJetifier=true

# Specifies whether the app is configured to use edge-to-edge via the app config or plugin
# WARNING: This property has been deprecated and will be removed in Expo SDK 55.
expo.edgeToEdgeEnabled=false

# Use this property to enable edge-to-edge display support.
edgeToEdgeEnabled=false

# React Native architecture flags
newArchEnabled=false
hermesEnabled=true